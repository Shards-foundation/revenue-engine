name: Mark stale issues and pull requests
on:
  schedule:
    - cron: '33 23 * * *'
permissions: {}
jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been marked stale because it has had no recent activity. It will close after 7 more days without activity.'
          stale-pr-message: 'This pull request has been marked stale because it has had no recent activity. It will close after 7 more days without activity.'
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
          days-before-stale: 60
          days-before-close: 7
