name: Greetings
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
permissions:
  contents: none
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  greeting:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Greet first-time contributors
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Thanks for opening your first issue. A maintainer will take a look."
          pr-message: "Thanks for opening your first pull request. A maintainer will review it soon."
