name: Manual workflow
on:
  workflow_dispatch:
    inputs:
      name:
        description: Person to greet
        default: World
        required: true
        type: string
permissions: {}
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Send greeting
        env:
          GREET_NAME: ${{ inputs.name }}
        run: printf 'Hello %s\n' "$GREET_NAME"
